name: Bootstrap launcher source

on:
  push:
    branches: ["main"]
    paths:
      - "StorePOS-Terminal-Launcher-v1.1.0-source.zip"
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          unzip -q StorePOS-Terminal-Launcher-v1.1.0-source.zip -d "$TMP_DIR"
          rsync -a "$TMP_DIR/StorePOS-Terminal-Launcher/" ./
          rm -f StorePOS-Terminal-Launcher-v1.1.0-source.zip
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: expand StorePOS Terminal Launcher v1.1.0 source"
          git push origin HEAD:main
