name: Bootstrap StorePOS Terminal Launcher Source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/source.part*"
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part00               .bootstrap/source.part01               .bootstrap/source.part02               .bootstrap/source.part03               .bootstrap/source.part04               .bootstrap/source.part05               .bootstrap/source.part06 > /tmp/source.zip.b64
          base64 --decode /tmp/source.zip.b64 > /tmp/source.zip
          echo "dbda5462a1068e9d3b3cdbf714a13ed19bc7a709c4c6aa207e379292f686ea82  /tmp/source.zip" | sha256sum -c -
          rm -rf /tmp/storepos-launcher-source
          mkdir -p /tmp/storepos-launcher-source
          unzip -q /tmp/source.zip -d /tmp/storepos-launcher-source

      - name: Install finalized source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a /tmp/storepos-launcher-source/StorePOS-Terminal-Launcher/ ./
          git status --short

      - name: Commit finalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: finalize StorePOS Terminal Launcher v1.1.0 white edition"
          git push origin HEAD:main
