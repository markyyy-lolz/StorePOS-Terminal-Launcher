name: Release StorePOS Terminal Launcher

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        default: "v1.2.0"
        type: string
  push:
    branches:
      - "publish/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME#publish/}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: storepos-terminal-launcher-signing-v1

      - name: Create stable signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=StorePOS Terminal Launcher,O=StorePOS,C=PH"
          fi

      - name: Test and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "StorePOS-Terminal-Launcher-${RELEASE_TAG}.apk"
          sha256sum "StorePOS-Terminal-Launcher-${RELEASE_TAG}.apk" > "StorePOS-Terminal-Launcher-${RELEASE_TAG}.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "StorePOS-Terminal-Launcher-${RELEASE_TAG}.apk" "StorePOS-Terminal-Launcher-${RELEASE_TAG}.apk.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "StorePOS-Terminal-Launcher-${RELEASE_TAG}.apk" "StorePOS-Terminal-Launcher-${RELEASE_TAG}.apk.sha256" --target "$GITHUB_SHA" --title "StorePOS Terminal Launcher ${RELEASE_TAG}" --notes-file RELEASE_NOTES.md
          fi
